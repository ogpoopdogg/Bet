<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parlay Value · NHL</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0C1218">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{--bg:#0e1116;--card:#161b22;--line:#2a313c;--text:#e6edf3;--muted:#8b949e;--acc:#f2c94c;--good:#3fb950;--bad:#f85149;--warn:#d29922;--in:#0d1117}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b0e13;border-bottom:1px solid var(--line);padding:10px 12px 0}
header h1{font-size:16px;margin:0 0 6px}
header h1 span{color:var(--acc)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:var(--muted);padding:8px 10px;border-bottom:2px solid transparent;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--acc)}
main{max-width:1150px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
h3{font-size:12px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--in);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;min-width:0}
input[type=number]{width:90px}
input.odds{width:80px}
input.sm{width:64px;padding:4px 6px}
button.b{background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
button.b:hover{border-color:var(--muted)}
button.p{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
button.s{padding:4px 8px;font-size:12px}
button.x{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}.small{font-size:12px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
.game{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.big div{background:var(--in);border:1px solid var(--line);border-radius:8px;padding:8px}
.big b{display:block;font-size:18px}
.big span{font-size:11px;color:var(--muted)}
.pill{display:inline-block;padding:1px 6px;border-radius:10px;background:#21262d;font-size:11px;color:var(--muted);margin-right:4px}
.leg{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.leg .t{font-weight:600}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 8px}
#modal[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:860px;width:100%;padding:14px;position:relative}
.sheet .close{position:absolute;top:8px;right:8px}
.sheet h2{font-size:16px;margin:0 40px 4px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#21262d;border:1px solid var(--line);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
pre{background:var(--in);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;font-size:12px;white-space:pre}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.help{font-size:11px;color:var(--muted);margin-top:2px}
.bar{fill:#4b5563}.bar.hit{fill:var(--good)}
.progress{color:var(--acc)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
body.locked header,body.locked main,body.locked nav{display:none}
#login{display:none;max-width:360px;margin:12vh auto 0;padding:20px}
body.locked #login{display:block}
#login h1{font-size:22px;margin:0 0 4px}#login h1 span{color:var(--acc)}
#login p{color:var(--muted);margin:0 0 16px}
#login input{width:100%;margin-bottom:10px;padding:11px 12px}
#login button{width:100%;padding:11px}
#loginErr{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.hdr{display:flex;align-items:center;gap:8px}.hdr h1{flex:1}
#installBtn{display:none;box-shadow:0 0 0 0 rgba(242,201,76,.6);animation:pvglow 2.4s ease-in-out infinite}
@keyframes pvglow{50%{box-shadow:0 0 0 6px rgba(242,201,76,0)}}
@media (prefers-reduced-motion:reduce){#installBtn{animation:none}}
nav button.adv{display:none}body.adv nav button.adv{display:inline-block}
.bigbtn{display:block;width:100%;font-size:20px;padding:18px;border-radius:12px}
.pbar{height:10px;background:var(--in);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.pbar div{height:100%;background:var(--acc);transition:width .3s}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.pcard .chance{font-size:22px;font-weight:700;margin:2px 0}
.pcard .need{font-size:14px;margin:6px 0 10px}
.pcard ol{margin:8px 0 10px;padding-left:22px}
.pcard li{margin-bottom:8px;font-size:15px}
.pcard li .look{display:block;font-size:12px;color:var(--muted)}
.pcard input.price{font-size:18px;width:130px;padding:10px}
.verdict{margin-top:10px;padding:12px;border-radius:10px;font-size:18px;font-weight:700}
.verdict.good{background:rgba(63,185,80,.15);color:var(--good);border:1px solid var(--good)}
.verdict.bad{background:rgba(248,81,73,.12);color:var(--bad);border:1px solid var(--bad)}
.verdict span{display:block;font-size:13px;font-weight:400;color:var(--text);margin-top:4px}

/* =====================  ARENA LOOK  ===================== */
:root{--bg:#0C1218;--card:#151D26;--line:#263241;--text:#EAF2F6;--muted:#8B9BAB;--acc:#FFD60A;--good:#22B862;--bad:#FF4D4D;--warn:#F5A524;--in:#0F161D;
  --gold:#FFD60A;--gold-deep:#E8B800;--green:#1FAE5B;--ice:#EAF2F6;--r-s:8px;--r-m:12px;--r-l:18px;
  --ease:cubic-bezier(.2,.9,.25,1);--disp:"Barlow Condensed","Arial Narrow",system-ui,sans-serif}
body{font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;
  background:radial-gradient(1200px 500px at 50% -180px,#1A2836 0%,transparent 70%),var(--bg);background-attachment:fixed;
  -webkit-tap-highlight-color:transparent}
h1,h2,.chance,.big b,.wm{font-family:var(--disp)}
/* header */
header{background:rgba(12,18,24,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(38,50,65,.7);padding:10px 14px}
.hdr{gap:10px}
.brand{display:flex;align-items:center;gap:8px;margin:0;font-size:24px;font-weight:800;letter-spacing:.2px;line-height:1}
.brand .mark{width:46px;height:34px;flex:none}
.brand .wm{color:var(--ice)}
.brand .wm b{color:var(--gold);font-weight:800}
header h1 span{color:inherit}
/* bottom tab bar — thumb friendly */
nav{position:fixed;left:0;right:0;bottom:0;z-index:15;display:flex;gap:4px;padding:8px 10px calc(8px + env(safe-area-inset-bottom));
  background:rgba(14,21,28,.92);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:1 0 auto;min-width:76px;border:0;border-radius:12px;padding:10px 12px;font:600 14px/1.1 "Barlow",system-ui,sans-serif;color:var(--muted);border-bottom:0;transition:background .25s var(--ease),color .25s var(--ease),transform .15s}
nav button.on{color:#14110A;background:var(--gold);border-bottom:0;box-shadow:0 6px 18px -8px rgba(255,214,10,.7)}
nav button:active{transform:scale(.96)}
#advToggle{flex:0 0 auto;min-width:0;color:var(--muted);font-weight:500}
main{padding:16px 14px calc(96px + env(safe-area-inset-bottom));max-width:760px}
body.adv main{max-width:1150px}
/* surfaces */
.card{border-radius:var(--r-l);border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.025),transparent 60%),var(--card);padding:16px}
.card h2{font-size:24px;font-weight:700;letter-spacing:.2px;margin:0 0 8px}
h3{font-family:"Barlow",system-ui,sans-serif;text-transform:none;letter-spacing:0;font-size:13px;font-weight:600;color:var(--muted)}
input,select,textarea{border-radius:10px;padding:10px 12px;font-size:15px;transition:border-color .2s,box-shadow .2s}
input:focus,select:focus{outline:none;border-color:var(--gold);box-shadow:0 0 0 3px rgba(255,214,10,.18)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button.b{border-radius:10px;padding:10px 14px;font-weight:600;transition:transform .12s var(--ease),background .2s,border-color .2s,box-shadow .2s}
button.b:active{transform:scale(.97)}
button.p{background:linear-gradient(180deg,#FFE04A,var(--gold) 55%,var(--gold-deep));color:#14110A;border-color:transparent;box-shadow:0 1px 0 rgba(255,255,255,.4) inset,0 8px 20px -10px rgba(255,214,10,.6)}
button.s{padding:6px 10px;border-radius:8px}
label.b{display:inline-block;background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-weight:600;cursor:pointer}
.bigbtn{font-family:var(--disp);font-size:24px;font-weight:800;letter-spacing:.4px;padding:18px;border-radius:16px;position:relative;overflow:hidden}
.bigbtn::after{content:"";position:absolute;inset:0;background:linear-gradient(105deg,transparent 35%,rgba(255,255,255,.55) 50%,transparent 65%);transform:translateX(-120%)}
.bigbtn:not(:disabled):hover::after,.bigbtn:not(:disabled):focus-visible::after{animation:pvSheen .9s var(--ease)}
.bigbtn:disabled{filter:saturate(.4) brightness(.8)}
@keyframes pvSheen{to{transform:translateX(120%)}}
.chk{font-size:14px;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--gold)}
label.chk[style*="min-width:140px"]{background:var(--in);border:1px solid var(--line);border-radius:999px;padding:8px 12px;min-width:0!important;transition:border-color .2s,background .2s}
label.chk[style*="min-width:140px"]:has(input:checked){border-color:rgba(255,214,10,.6);background:rgba(255,214,10,.08)}
/* progress: green speed stripes */
.pbar{height:12px;border-radius:999px;border:0;background:#0F161D;box-shadow:inset 0 0 0 1px var(--line)}
.pbar div{background:repeating-linear-gradient(-55deg,var(--green) 0 12px,#3DDC84 12px 24px);background-size:200% 100%;border-radius:999px;animation:pvRun .8s linear infinite;box-shadow:0 0 14px rgba(31,174,91,.5)}
@keyframes pvRun{to{background-position:-28px 0}}
/* parlay cards = bet slips */
.pcard{position:relative;border-radius:var(--r-l);border:1px solid var(--line);padding:16px 16px 14px;
  background:linear-gradient(160deg,rgba(255,214,10,.05),transparent 35%),var(--card);box-shadow:0 18px 40px -28px rgba(0,0,0,.9)}
.pcard::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--gold),var(--green))}
.pcard .small.muted:first-child{font-weight:600;color:var(--muted)}
.pcard{scroll-margin-top:76px}
.pcard .chance{display:flex;align-items:center;gap:12px;margin:8px 0 2px}
.pcard .chance b{font-size:56px;font-weight:800;line-height:.9;letter-spacing:.5px;color:var(--ice)}
.pcard .chance span{font-family:"Barlow",system-ui,sans-serif;font-size:14px;font-weight:500;line-height:1.3;color:var(--muted)}
.pcard input[data-flp]{width:104px;font-size:14px}
.pcard ol{list-style:none;padding:0;margin:14px 0 10px;counter-reset:leg}
.pcard li{position:relative;padding:10px 0 10px 34px;border-top:1px solid rgba(38,50,65,.6);font-weight:600;counter-increment:leg}
.pcard li:first-child{border-top:0}
.pcard li::before{content:counter(leg);position:absolute;left:0;top:10px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:700 13px/1 var(--disp);color:#14110A;background:var(--gold)}
.pcard li .look{font-weight:400;margin-top:2px}
.pcard .need{position:relative;margin:14px -16px 12px;padding:16px 16px 4px;border-top:2px dashed #2E3B4B;font-size:15px}
.pcard .need::before,.pcard .need::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.pcard .need::before{left:-11px}.pcard .need::after{right:-11px}
.pcard .need b{color:var(--gold);font-family:var(--disp);font-size:20px;font-weight:800}
.pcard input.price{font-family:var(--disp);font-size:22px;font-weight:700;width:140px}
.verdict{border-radius:14px;font-family:var(--disp);font-size:24px;letter-spacing:.3px}
.verdict span{font-family:"Barlow",system-ui,sans-serif;font-size:14px}
.verdict.good{background:linear-gradient(135deg,rgba(34,184,98,.22),rgba(34,184,98,.08));box-shadow:0 0 0 1px rgba(34,184,98,.6),0 12px 30px -16px rgba(34,184,98,.8);border:0}
.verdict.bad{background:linear-gradient(135deg,rgba(255,77,77,.18),rgba(255,77,77,.06));box-shadow:0 0 0 1px rgba(255,77,77,.5);border:0}
.verdict.pop{animation:pvPop .42s var(--ease)}
@keyframes pvPop{0%{transform:scale(.94);opacity:.4}60%{transform:scale(1.02);opacity:1}100%{transform:none}}
details summary{cursor:pointer;color:var(--ice);font-weight:600}
.big div{border-radius:14px;background:var(--in)}
.big b{font-size:26px;font-weight:800}
.leg{border-radius:14px;background:var(--card)}
#toast{border-radius:999px;background:#1C2733;padding:10px 18px;bottom:calc(96px + env(safe-area-inset-bottom));box-shadow:0 12px 30px -12px #000;font-weight:600}
.sheet{border-radius:22px}
#modal{background:rgba(5,8,11,.72);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#modal:not([hidden]) .sheet{animation:pvSheet .38s var(--ease)}
@keyframes pvSheet{from{transform:translateY(24px);opacity:0}}
/* screen change: quick slide that shows which way you moved */
#view.vin{animation:pvView .32s var(--ease)}
@keyframes pvView{from{opacity:0;transform:translateY(10px)}}
/* sign-in */
#login{text-align:center;max-width:380px;margin-top:8vh}
#login .lockup{width:210px;height:auto;display:block;margin:0 auto 6px}
#login h1{font-size:40px;font-weight:800;margin:0}
#login h1 b{color:var(--gold)}
#login input,#login button{text-align:left;border-radius:12px}
#login button{text-align:center;font-family:var(--disp);font-size:20px;font-weight:800}
/* ===== intro animation ===== */
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(600px 420px at 50% 55%,#16283A 0%,#0A1016 65%);transition:opacity .45s var(--ease),transform .45s var(--ease)}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
#splash svg{width:min(86vw,440px);height:auto;overflow:visible}
#splash .wmText{font-family:var(--disp);font-weight:800;font-size:54px;letter-spacing:.5px;fill:var(--ice)}
#splash .wmText tspan.g{fill:var(--gold)}
#splash .tag{font-family:"Barlow",sans-serif;font-weight:600;font-size:14px;letter-spacing:3px;fill:var(--muted)}
#splash .sp{transform-box:fill-box;transform-origin:center}
#splash .stripe{transform-origin:100% 50%;animation:pvStripe .6s var(--ease) both}
#splash .st2{animation-delay:.1s}#splash .st3{animation-delay:.2s}
@keyframes pvStripe{from{transform:translateX(-520px) scaleX(.2);opacity:0}to{transform:none;opacity:1}}
#splash .puck{animation:pvPuck .7s cubic-bezier(.15,.85,.3,1.15) .28s both}
@keyframes pvPuck{0%{transform:translateX(-460px) skewX(-28deg);opacity:0}15%{opacity:1}75%{transform:translateX(10px) skewX(6deg)}100%{transform:none}}
#splash .spray circle{animation:pvSpray .55s ease-out .82s both}
#splash .spray circle:nth-child(2){animation-delay:.86s}#splash .spray circle:nth-child(3){animation-delay:.9s}#splash .spray circle:nth-child(4){animation-delay:.84s}#splash .spray circle:nth-child(5){animation-delay:.88s}
@keyframes pvSpray{0%{opacity:0;transform:none}20%{opacity:1}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
#splash .crown{animation:pvDrop .6s cubic-bezier(.3,1.5,.55,1) 1s both}
@keyframes pvDrop{0%{transform:translateY(-300px) scale(.55) rotate(-10deg);opacity:0}60%{opacity:1}78%{transform:translateY(8px) scale(1.06,.94)}100%{transform:none}}
#splash .wave{animation:pvWave .7s ease-out 1.42s both}
@keyframes pvWave{0%{transform:scale(.25);opacity:0}15%{opacity:1}100%{transform:scale(2.6);opacity:0}}
#splash .glow{animation:pvGlow 1.2s ease-out 1.4s both}
@keyframes pvGlow{0%{opacity:0;transform:scale(.6)}35%{opacity:1;transform:scale(1.05)}100%{opacity:.45;transform:none}}
#splash .reveal{animation:pvReveal .5s var(--ease) 1.6s both}
@keyframes pvReveal{from{transform:scaleX(0)}to{transform:none}}
#splash .tagIn{animation:pvFade .4s ease 1.95s both}
@keyframes pvFade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){
  #splash *,#view.vin,.verdict.pop,#modal .sheet,.pbar div,.bigbtn::after{animation:none!important}
}
@media (min-width:820px){nav{left:50%;right:auto;transform:translateX(-50%);bottom:14px;border:1px solid var(--line);border-radius:18px;padding:8px;max-width:760px;width:calc(100% - 28px)}}
</style>
</head>

const $ = (s, el = document) => el.querySelector(s);

const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
function variance(a) { if (a.length < 2) return null; const m = mean(a); return a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1); }

/* =====================================================================
   PLAYER MODEL
   ===================================================================== */
const peCache = new Map();
async function playerEntries(ctx, pid, team, mk) {

  if (peCache.has(key)) return peCache.get(key);

  if (M.src === 'box') {
    for (const b of (ctx.box[team] || [])) {
      const p = b.pl[pid]; if (!p || p.t !== team) continue;
      const v = M.get(p); if (v == null || !isFinite(v)) continue;
      const home = b.home.a === team;
      entries.push({ gid: b.id, date: b.date, season: b.season, val: v, opp: home ? b.away.a : b.home.a, home, toi: p.toi });
    }
  } else {
    const seasons = seasonList(Math.max(S.seasonsBack, S.h2hSeasonsBack));
    const logs = await playerLogs(pid, seasons, S.includePlayoffs ? [2, 3] : [2]);
    for (const e of logs) {
      if (!(e.gameDate < ctx.date)) continue;
      if (M.src === 'glog' && S.goalieStartsOnly && e.gamesStarted !== 1) continue;

  entries.forEach((e, i) => { e.b2b = !!entries[i + 1] && entries[i + 1].date === dateAdd(e.date, -1); });

function legResult(v, line, side) { if (v > line) return side === 'over'; if (v < line) return side === 'under'; return null; }

}

async function analyzePlayer(ctx, pl, mk, line, side) {
  CUR = ctx.season;

  const opp = team === ctx.home ? ctx.away : ctx.home, isHome = team === ctx.home;
  const entries = await playerEntries(ctx, pl.id, team, mk);

  const oppRatio = M.opp ? ratios[M.opp] : null;
  const o = { line: M.first ? 0.5 : line, side: M.first ? 'over' : side, opp, isHome, oppRatio, goalie: !!M.goalie, isB2B: ctx.b2b ? !!ctx.b2b[team] : null };

/* =====================================================================

   ===================================================================== */

  }

/* player prop board */
async function pbScan() {
  const ctx = state.ctx; if (!ctx) return;
  const mk = $('#pbMarket').value, M = PM[mk];
  const line = M.first ? null : +$('#pbLine').value, side = M.first ? 'yes' : $('#pbSide').value;
  const tf = $('#pbTeam').value, pf = $('#pbPos').value;
  let players = ctx.players.filter(p => M.goalie ? p.pos === 'G' : p.pos !== 'G');
  if (tf !== 'both') players = players.filter(p => p.team === tf);
  if (!M.goalie && pf !== 'all') players = players.filter(p => pf === 'D' ? p.pos === 'D' : p.pos !== 'D');
  if (!players.length) { $('#pbOut').innerHTML = '<p class="muted">No players found on the current rosters.</p>'; return; }
  const seq = ++state.scanSeq; let done = 0; const rows = [];
  $('#pbOut').innerHTML = `<p class="progress">Scanning 0/${players.length}…</p>`;
  await Promise.all(players.map(async pl => {
    let res; try { res = await analyzePlayer(ctx, pl, mk, line, side); } catch (e) { res = { error: e.message }; }
    rows.push({ pl, res, odds: null }); done++;
    if (seq === state.scanSeq) { const pr = $('#pbOut .progress'); if (pr) pr.textContent = `Scanning ${done}/${players.length}…`; }
  }));
  if (seq !== state.scanSeq) return;
  rows.sort((a, b) => (b.res.p || -1) - (a.res.p || -1));
  state.scan = { gameId: ctx.game.id, mk, line, side, rows };
  renderScan();
}
function renderScan() {
  const sc = state.scan; const M = PM[sc.mk]; const el = $('#pbOut'); if (!el) return;
  const title = M.first ? 'First goalscorer' : `${cap(sc.side)} ${sc.line} ${M.label.toLowerCase()}`;
  let h = `<p class="small"><b>${esc(title)}</b> · ${sc.rows.length} players · sorted by probability</p><div class="tw"><table><tr>
    <th>Player</th><th>Tm</th><th class="n">GP</th><th class="n">Avg L${S.winMid}</th><th class="n">Hit L${S.winLong}</th><th class="n">vs opp</th><th class="n">Model</th><th class="n">Final</th><th class="n">Fair</th><th>bet365</th><th class="n">Edge</th><th class="n">EV</th><th></th></tr>`;
  sc.rows.forEach((r, i) => {
    const s = r.res;
    if (s.error) { h += `<tr><td>${esc(r.pl.name)}</td><td>${r.pl.team}</td><td colspan="11" class="muted small">${esc(s.error)}</td></tr>`; return; }
    const mid = s.rows.find(x => x.label === `Last ${S.winMid}`), lng = s.rows.find(x => x.label === `Last ${S.winLong}`);

      <td class="n">${s.n}</td><td class="n">${fx(mid?.avg)}</td><td class="n">${M.first ? '–' : (lng ? `${lng.hits}/${lng.dec}` : '–')}</td>
      <td class="n">${h2 ? `${fx(h2.raw)} (${h2.n})` : '–'}</td><td class="n">${pct(s.pModel)}</td><td class="n"><b>${pct(s.p)}</b></td><td class="n">${fmtOdds(1 / s.p)}</td>
      <td><input class="odds sm" data-scanodds="${i}" value="${r.odds ? oddsInputVal(r.odds) : ''}"></td>

function scanEdge(i) {
  const r = state.scan.rows[i]; if (!r || r.res.error) return;

function scanAdd(i) {

/* ---------- detail views ---------- */
function barChart(vals, line) {
  if (!vals.length) return '';
  const n = vals.length, W = Math.max(320, n * 20), H = 110;
  const max = Math.max(line == null ? 1 : line + 1, ...vals.map(v => v.v), 1); const bw = W / n;
  let s = `<svg viewBox="0 0 ${W} ${H + 16}" width="100%" style="max-width:${W}px" role="img" aria-label="Recent games">`;
  vals.forEach((v, i) => {
    const h = (v.v / max) * H;
    s += `<rect class="bar ${v.hit ? 'hit' : ''}" x="${i * bw + 2}" y="${H - h}" width="${Math.max(2, bw - 4)}" height="${Math.max(h, 1)}"><title>${esc(v.d)} ${esc(v.o || '')}: ${v.v}</title></rect><text x="${i * bw + bw / 2}" y="${H + 12}" font-size="9" fill="#8b949e" text-anchor="middle">${v.v}</text>`;
  });
  if (line != null) { const ly = H - (line / max) * H; s += `<line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="#f2c94c" stroke-dasharray="4 3"/>`; }
  return s + '</svg>';
}

/* ---------- 📝 Auto-grading of saved parlays ---------- */
const BOX_STAT = { sog: 'sog', goals: 'goals', points: 'points', assists: 'assists', blocks: 'blockedShots', hits: 'hits', pim: 'pim', saves: 'saves' };
async function finalGame(g) {
  // Club schedule (verified fields: gameState, scores, gameOutcome.lastPeriodType) tells us if the game is over.
  const d = await api(`v1/club-schedule-season/${g.home}/${g.season}`, 300000);
  const x = (d.games || []).find(y => y.id === g.gameId);
  if (!x || !['OFF', 'FINAL'].includes(x.gameState) || x.homeTeam?.score == null) return null;
  return { hs: x.homeTeam.score, as: x.awayTeam.score, reg: (x.gameOutcome?.lastPeriodType || 'REG') === 'REG' };
}
function boxPlayers(b) {
  const all = [];
  for (const side of ['homeTeam', 'awayTeam']) { const grp = b.playerByGameStats?.[side] || {}; for (const k of ['forwards', 'defense', 'goalies']) for (const p of (grp[k] || [])) all.push(p); }
  return all;
}
function gradeFrom(g, fin, box) {
  if (g.kind === 'player') {
    const stat = BOX_STAT[g.market]; if (!stat || !box) return null;
    const p = boxPlayers(box).find(x => x.playerId === g.subjectId);
    if (!p) return 'void';
    const v = p[stat]; if (v == null) return null;
    const r = legResult(v, g.line, g.side);
    return r === null ? 'void' : (r ? 'won' : 'lost');
  }
  if (g.kind === 'team') {
    const pred = teamPredicate({ market: g.market, side: g.side, line: g.line }); if (!pred) return null;
    const [t, o] = g.team === g.home ? [fin.hs, fin.as] : [fin.as, fin.hs];
    const r = pred(t, o, fin.reg);
    return r === 'W' ? 'won' : r === 'L' ? 'lost' : 'void';
  }
  return null;
}
async function gradeLeg(g) {
  if (!g || !g.gameId || !g.home || !g.season) return null;
  if (g.start && Date.now() < new Date(g.start).getTime() + 2 * 3600e3) return null;
  const fin = await finalGame(g); if (!fin) return null;
  const box = g.kind === 'player' ? await api(`v1/gamecenter/${g.gameId}/boxscore`, 864e5) : null;
  return gradeFrom(g, fin, box);
}
async function gradeTracker() {
  let changed = false;
  for (const t of TRACK) {
    if (t.status !== 'open' || !t.legs.some(l => l.g)) continue;
    for (const l of t.legs) {
      if (!l.g || l.result) continue;
      try { const r = await gradeLeg(l.g); if (r) { l.result = r; changed = true; } } catch (e) {}
    }
    const rs = t.legs.map(l => l.result);
    if (rs.includes('lost')) { t.status = 'lost'; t.auto = true; changed = true; }
    else if (rs.length && rs.every(r => r === 'won')) { t.status = 'won'; t.auto = true; changed = true; }
    else if (rs.every(r => r) && rs.includes('void')) { t.note = 'A bet was cancelled (player didn\'t play, or a tie on the line). Check what bet365 did and set the result yourself.'; changed = true; }
  }
  if (changed) saveTrack();
  return changed;
}

/* ---------- 🧪 Backtest: replay past games, check accuracy, tune settings ---------- */
const TUNE_STEPS = [

  ['goalieStrength', [0, 0.25, 0.5, 0.75, 1]],
  ['penStrength', [0, 0.5, 1]],
  ['wRest', [0, 5, 10, 20]],
  ['teamShrinkK', [10, 20, 30, 45, 70]],
  ['teamL10Weight', [0, 0.15, 0.3, 0.5]],
  ['teamSplitWeight', [0, 0.25, 0.5, 0.75, 1]],
  ['restStrength', [0, 0.5, 1]],

const TEAM_KEYS = ['teamShrinkK', 'teamL10Weight', 'teamSplitWeight', 'h2hTeamWeight', 'shrinkK', 'goalieStrength', 'restStrength', 'enLead1', 'enLead2', 'drawInflation', 'otHomeShare'];
const W_MIX = { recent: { wSeason: 15, wShort: 25, wMid: 30, wLong: 20 }, balanced: { wSeason: 30, wShort: 15, wMid: 25, wLong: 20 }, season: { wSeason: 50, wShort: 5, wMid: 15, wLong: 25 } };
function dateAdd(d, n) { const x = new Date(d + 'T12:00:00'); x.setDate(x.getDate() + n); return x.getFullYear() + '-' + String(x.getMonth() + 1).padStart(2, '0') + '-' + String(x.getDate()).padStart(2, '0'); }
function btProg(text, f) {
  const el = $('#btProg'); if (!el) return;
  el.innerHTML = f == null ? '' : `<div class="pbar"><div style="width:${Math.round(clamp(f, 0, 1) * 100)}%"></div></div><div class="small muted">${esc(text)}</div>`;
}
function legP(l) {
  if (l.kind === 'team' && l.ctx && l.spec) {   // team bets: rebuild the game model with the settings being tried
    const sig = TEAM_KEYS.map(k => S[k]).join('|');
    if (l.ctx._tmSig !== sig) { CUR = l.ctx.season; l.ctx.tm = teamModel(l.ctx); l.ctx._tmSig = sig; }
    const r = analyzeTeam(l.ctx, l.spec); return r.error ? l.p : r.p;
  }
  if (l.kind !== 'player' || !l.entries) return l.p;
  CUR = l.season;
  const r = analyzeEntries(l.entries, l.o);
  return r.error ? l.p : r.p;
}
function logLoss(legs) {
  let s = 0;
  for (const l of legs) { const p = clamp(legP(l), 0.01, 0.99); s += -(l.y ? Math.log(p) : Math.log(1 - p)); }
  return legs.length ? s / legs.length : 0;
}
function setMix(name) { Object.assign(S, W_MIX[name]); }
function currentMix() { return Object.keys(W_MIX).find(k => Object.entries(W_MIX[k]).every(([a, b]) => S[a] === b)) || null; }
async function runBacktest() {
  if (state.btRunning) return;

  const btn = $('#btGo'); if (btn) btn.disabled = true;
  const days = +($('#btDays')?.value || 5);
  const saved = Object.assign({}, S);
  const legs = [], parlays = [];
  try {
    const dates = []; for (let i = 1; i <= days; i++) dates.push(dateAdd(todayStr(), -i));
    let gi = 0; const allGames = [];
    for (const date of dates) {
      btProg(`Finding games on ${date}…`, 0.02);
      const d = await api(`v1/schedule/${date}`, 864e5);
      const wk = (d.gameWeek || []).find(w => w.date === date);
      for (const g of (wk?.games || [])) if ((g.gameType === 2 || g.gameType === 3) && ['OFF', 'FINAL'].includes(g.gameState)) allGames.push({ id: g.id, date, season: g.season, start: g.startTimeUTC, home: g.homeTeam.abbrev, away: g.awayTeam.abbrev, homeName: g.homeTeam.commonName?.default || g.homeTeam.abbrev, awayName: g.awayTeam.commonName?.default || g.awayTeam.abbrev });
    }
    if (!allGames.length) throw new Error('No finished games found in those days.');
    const byDate = {}, ctxs = [];
    for (const g of allGames) {
      gi++; btProg(`Loading game ${gi} of ${allGames.length}: ${g.away} @ ${g.home} (${g.date})`, 0.03 + 0.35 * (gi - 1) / allGames.length);
      try { ctxs.push(await loadCtx(g)); } catch (e) { toast(`${g.away} @ ${g.home}: ${e.message}`); }
    }
    btProg('Working out league averages and goalies…', 0.39);
    for (const ctx of ctxs) await refreshCtx(ctx);
    let ci = 0;
    for (const ctx of ctxs) {
      ci++; const g = ctx.game;
      const label = `Replaying game ${ci} of ${ctxs.length}: ${g.away} @ ${g.home} (${g.date})`;
      btProg(label, 0.4 + 0.4 * (ci - 1) / ctxs.length);
      try {
        const cands = await finderGameLegs(ctx, f => btProg(label, 0.4 + 0.4 * (ci - 1 + f) / ctxs.length));
        const fin = await finalGame({ gameId: g.id, home: g.home, season: ctx.season });
        if (!fin) continue;
        const box = await api(`v1/gamecenter/${g.id}/boxscore`, 864e5);
        for (const c of cands) {
          const r = gradeFrom(gradeInfo(c), fin, box);
          if (r !== 'won' && r !== 'lost') continue;
          const y = r === 'won' ? 1 : 0;
          const l = { p: c.p, y, kind: c.kind, market: c.market, gameId: g.id, season: ctx.season };
          if (c.kind === 'player' && c.res?._entries && c.res?._o) { l.entries = c.res._entries; l.o = c.res._o; }
          if (c.kind === 'team') { l.ctx = ctx; l.spec = { market: c.market, team: c.team, side: c.side, line: c.line }; }
          c._y = y; legs.push(l);

        (byDate[g.date] = byDate[g.date] || []).push(...cands.filter(c => c._y != null));
      } catch (e) { toast(`${g.away} @ ${g.home}: ${e.message}`); }
    }

    btProg('Checking the app\'s top parlays…', 0.82);

function onInput(ev) {

function onChange(ev) {
  const t = ev.target;

  if (t.id === 'pbMarket') { syncPbForm(); return; }

  if (t.dataset.ftype || t.id === 'fHigh' || t.id === 'fUnders') {

    const hh = $('#fHighHelp'); if (hh) hh.textContent = S.finderHighest ? 'On: the most likely parlays, any mix of the checked types.' : `Off: every leg is a different type${S.finderTypes.length === S.finderLegs ? ' — one of each checked type' : ''}.`;
    findSettingsChanged(); return;

function importData(file) {

  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== 'parlay-value') throw new Error('Not a Parlay Value backup');
      if (!confirm('Replace current settings, legs and tracker with this backup?')) return;
      S = Object.assign({}, DEFAULTS, d.settings || {}); LEGS = d.legs || []; TRACK = d.tracker || [];
      saveSettings(); saveLegs(); saveTrack(); toast('Imported'); setTab(state.tab);
    } catch (e) { toast('Import failed: ' + e.message); }
  };
  r.readAsText(file);
}
