<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Parlay Value · NHL</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b0e13">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Parlay Value">
<style>
:root{--bg:#0e1116;--card:#161b22;--line:#2a313c;--text:#e6edf3;--muted:#8b949e;--acc:#f2c94c;--good:#3fb950;--bad:#f85149;--warn:#d29922;--in:#0d1117}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:#0b0e13;border-bottom:1px solid var(--line);padding:10px 12px 0}
header h1{font-size:16px;margin:0 0 6px}
header h1 span{color:var(--acc)}
nav{display:flex;gap:2px;overflow-x:auto}
nav button{background:none;border:0;color:var(--muted);padding:8px 10px;border-bottom:2px solid transparent;font:inherit;cursor:pointer;white-space:nowrap}
nav button.on{color:var(--text);border-bottom-color:var(--acc)}
main{max-width:1150px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:12px}
.card h2{font-size:15px;margin:0 0 10px}
h3{font-size:12px;margin:14px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted)}
input,select,textarea{background:var(--in);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 8px;font:inherit;min-width:0}
input[type=number]{width:90px}
input.odds{width:80px}
input.sm{width:64px;padding:4px 6px}
button.b{background:#21262d;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}
button.b:hover{border-color:var(--muted)}
button.p{background:var(--acc);color:#111;border-color:var(--acc);font-weight:600}
button.s{padding:4px 8px;font-size:12px}
button.x{color:var(--bad)}
button:disabled{opacity:.5;cursor:default}
.muted{color:var(--muted)}.small{font-size:12px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:180px}
.game{display:flex;justify-content:space-between;align-items:center;gap:8px}
.big{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:8px 0}
.big div{background:var(--in);border:1px solid var(--line);border-radius:8px;padding:8px}
.big b{display:block;font-size:18px}
.big span{font-size:11px;color:var(--muted)}
.pill{display:inline-block;padding:1px 6px;border-radius:10px;background:#21262d;font-size:11px;color:var(--muted);margin-right:4px}
.leg{border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px}
.leg .t{font-weight:600}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 8px}
#modal[hidden]{display:none}
.sheet{background:var(--card);border:1px solid var(--line);border-radius:12px;max-width:860px;width:100%;padding:14px;position:relative}
.sheet .close{position:absolute;top:8px;right:8px}
.sheet h2{font-size:16px;margin:0 40px 4px 0}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#21262d;border:1px solid var(--line);padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}
#toast.on{opacity:1}
pre{background:var(--in);border:1px solid var(--line);border-radius:6px;padding:8px;overflow:auto;font-size:12px;white-space:pre}
.setgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.help{font-size:11px;color:var(--muted);margin-top:2px}
.bar{fill:#4b5563}.bar.hit{fill:var(--good)}
.progress{color:var(--acc)}
.chk{display:flex;align-items:center;gap:6px;font-size:13px}
body.locked header,body.locked main{display:none}
#login{display:none;max-width:360px;margin:12vh auto 0;padding:20px}
body.locked #login{display:block}
#login h1{font-size:22px;margin:0 0 4px}#login h1 span{color:var(--acc)}
#login p{color:var(--muted);margin:0 0 16px}
#login input{width:100%;margin-bottom:10px;padding:11px 12px}
#login button{width:100%;padding:11px}
#loginErr{color:var(--bad);font-size:13px;min-height:18px;margin-top:10px}
.hdr{display:flex;align-items:center;gap:8px}.hdr h1{flex:1}
#installBtn{display:none;box-shadow:0 0 0 0 rgba(242,201,76,.6);animation:pvglow 2.4s ease-in-out infinite}
@keyframes pvglow{50%{box-shadow:0 0 0 6px rgba(242,201,76,0)}}
@media (prefers-reduced-motion:reduce){#installBtn{animation:none}}
nav button.adv{display:none}body.adv nav button.adv{display:inline-block}
.bigbtn{display:block;width:100%;font-size:20px;padding:18px;border-radius:12px}
.pbar{height:10px;background:var(--in);border:1px solid var(--line);border-radius:6px;overflow:hidden;margin:10px 0 4px}
.pbar div{height:100%;background:var(--acc);transition:width .3s}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:14px}
.pcard .chance{font-size:22px;font-weight:700;margin:2px 0}
.pcard .need{font-size:14px;margin:6px 0 10px}
.pcard ol{margin:8px 0 10px;padding-left:22px}
.pcard li{margin-bottom:8px;font-size:15px}
.pcard li .look{display:block;font-size:12px;color:var(--muted)}
.pcard input.price{font-size:18px;width:130px;padding:10px}
.verdict{margin-top:10px;padding:12px;border-radius:10px;font-size:18px;font-weight:700}
.verdict.good{background:rgba(63,185,80,.15);color:var(--good);border:1px solid var(--good)}
.verdict.bad{background:rgba(248,81,73,.12);color:var(--bad);border:1px solid var(--bad)}
.verdict span{display:block;font-size:13px;font-weight:400;color:var(--text);margin-top:4px}
</style>
</head>
<body class="locked">
<section id="login">
  <h1><span>Parlay Value</span> · NHL</h1>
  <p>Sign in to continue.</p>
  <input id="lgEmail" type="email" placeholder="Email" autocomplete="username">
  <input id="lgPass" type="password" placeholder="Password" autocomplete="current-password">
  <button id="lgBtn" class="b p">Sign in</button>
  <div id="loginErr"></div>
</section>
<header>
  <div class="hdr"><h1><span>Parlay Value</span> · NHL</h1>
    <button id="installBtn" class="b s p">Install app</button>
    <button id="signOutBtn" class="b s">Sign out</button></div>
  <nav id="nav">
    <button data-tab="find">🔍 Find</button>
    <button data-tab="games" class="adv">Games</button>
    <button data-tab="game" class="adv">Game</button>
    <button data-tab="legs" class="adv">Leg pool</button>
    <button data-tab="parlays" class="adv">Parlays</button>
    <button data-tab="tracker">Tracker</button>
    <button data-tab="settings">Settings</button>

</header>
<main id="view"></main>
<div id="modal" hidden><div class="sheet"><button class="b s close" data-act="closeModal">✕</button><div id="modalBody"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script>
'use strict';
/* =====================================================================
   Parlay Value · NHL
   Stats: NHL public web API (api-web.nhle.com). Odds: typed in by you (bet365).
   Every probability is shown with the steps used to build it.
   ===================================================================== */

/* ---------- storage ---------- */
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};

/* ---------- settings ---------- */
const SCHEMA = [
  { group: 'Connection' },
  { key: 'connMode', label: 'Connection mode', type: 'select', def: 'auto', options: [['auto', 'Auto (direct, then proxy)'], ['direct', 'Direct only'], ['proxy', 'Proxy only']], help: 'If the browser blocks direct NHL calls, set up the free proxy (bottom of this page).' },
  { key: 'proxyUrl', label: 'Proxy URL', type: 'text', def: '', help: 'Your Cloudflare Worker URL, e.g. https://nhl.yourname.workers.dev' },
  { key: 'seasonOverride', label: 'Season override', type: 'text', def: '', help: 'Blank = use the game\'s season. Format 20262027.' },

  { group: 'How far back' },
  { key: 'seasonsBack', label: 'Seasons of player history', type: 'number', def: 2, min: 1, max: 8, step: 1, help: '1 = this season only. Used for averages, windows and variance.' },
  { key: 'seasonDecay', label: 'Weight per older season', type: 'number', def: 0.5, min: 0, max: 1, step: 0.05, help: 'Last season counts this much, the season before counts this squared, etc. 1 = all equal, 0 = ignore older seasons.' },
  { key: 'h2hSeasonsBack', label: 'Seasons of head-to-head history', type: 'number', def: 3, min: 1, max: 8, step: 1, help: 'How far back to look for games vs this opponent.' },
  { key: 'winShort', label: 'Short window (games)', type: 'number', def: 5, min: 1, max: 82, step: 1 },
  { key: 'winMid', label: 'Medium window (games)', type: 'number', def: 10, min: 1, max: 82, step: 1 },
  { key: 'winLong', label: 'Long window (games)', type: 'number', def: 20, min: 1, max: 164, step: 1, help: 'Also the window used for the raw hit rate.' },
  { key: 'boxDepth', label: 'Box scores per team', type: 'number', def: 15, min: 0, max: 82, step: 1, help: 'Recent games whose box scores load per team. Feeds hits, blocked shots, team shots and opponent shot factors. More = slower first load.' },
  { key: 'includePlayoffs', label: 'Include playoff games', type: 'bool', def: false },
  { key: 'goalieStartsOnly', label: 'Goalies: starts only', type: 'bool', def: true, help: 'Ignore relief appearances in goalie samples.' },

  { group: 'Player rate blend (relative weights)' },
  { key: 'wSeason', label: 'Season-weighted average', type: 'number', def: 30, min: 0, max: 100, step: 1 },
  { key: 'wShort', label: 'Short window', type: 'number', def: 15, min: 0, max: 100, step: 1 },
  { key: 'wMid', label: 'Medium window', type: 'number', def: 25, min: 0, max: 100, step: 1 },
  { key: 'wLong', label: 'Long window', type: 'number', def: 20, min: 0, max: 100, step: 1 },
  { key: 'wH2H', label: 'Head-to-head vs opponent', type: 'number', def: 5, min: 0, max: 100, step: 1 },
  { key: 'wVenue', label: 'Home / road split', type: 'number', def: 5, min: 0, max: 100, step: 1 },
  { key: 'shrinkK', label: 'Small-sample shrink (games)', type: 'number', def: 5, min: 0, max: 50, step: 1, help: 'Head-to-head, home/road and hit rates are pulled toward the bigger picture as if this many average games were added. 0 = trust tiny samples fully.' },
  { key: 'minGames', label: 'Flag samples smaller than', type: 'number', def: 10, min: 1, max: 82, step: 1 },

  { group: 'Adjustments' },
  { key: 'oppStrength', label: 'Opponent adjustment strength', type: 'number', def: 0.5, min: 0, max: 1, step: 0.05, help: '0 = ignore opponent. 1 = full ratio (e.g. opponent allows 10% more shots than average → ×1.10).' },
  { key: 'toiStrength', label: 'Ice-time trend strength', type: 'number', def: 0.5, min: 0, max: 1, step: 0.05, help: 'Recent TOI vs average TOI. 0 = ignore.' },
  { key: 'empWeight', label: 'Hit-rate weight in final %', type: 'number', def: 0.25, min: 0, max: 1, step: 0.05, help: 'Final = (1 − this) × model + this × shrunk hit rate over the long window.' },
  { key: 'distModel', label: 'Count distribution', type: 'select', def: 'nb', options: [['nb', 'Negative binomial (uses real variance)'], ['poisson', 'Poisson']], help: 'Shots and saves usually vary more than Poisson assumes; negative binomial uses the player\'s own variance.' },

  { group: 'Team / game model' },
  { key: 'teamL10Weight', label: 'Last-10 form weight', type: 'number', def: 0.3, min: 0, max: 1, step: 0.05 },
  { key: 'teamSplitWeight', label: 'Home/road split weight', type: 'number', def: 0.5, min: 0, max: 1, step: 0.05 },
  { key: 'h2hTeamWeight', label: 'Head-to-head meetings weight', type: 'number', def: 0.1, min: 0, max: 1, step: 0.05 },
  { key: 'otHomeShare', label: 'Home win share of OT/SO', type: 'number', def: 0.5, min: 0, max: 1, step: 0.01 },
  { key: 'drawInflation', label: 'Regulation tie multiplier', type: 'number', def: 1, min: 0.5, max: 2, step: 0.05, help: '1 = plain independent Poisson. Raise if you find ties are under-predicted.' },
  { key: 'totalsIncludeOT', label: 'Totals include OT/SO', type: 'bool', def: true, help: 'Check bet365\'s rules for the market; turn off for regulation-only totals.' },

  { group: 'Parlay builder' },
  { key: 'legsPerParlay', label: 'Legs per parlay', type: 'number', def: 3, min: 2, max: 6, step: 1 },
  { key: 'minLegProb', label: 'Min leg probability', type: 'number', def: 0.3, min: 0, max: 0.99, step: 0.01 },
  { key: 'minEV', label: 'Min parlay EV %', type: 'number', def: 0, min: -100, max: 500, step: 0.5 },
  { key: 'minEdge', label: 'Min parlay edge (pts)', type: 'number', def: 0, min: -100, max: 100, step: 0.5, help: 'Model % minus implied %.' },
  { key: 'maxLegsPerGame', label: 'Max legs from one game', type: 'number', def: 2, min: 1, max: 6, step: 1, help: 'Set 1 to never build same-game parlays.' },
  { key: 'maxResults', label: 'Results to show', type: 'number', def: 40, min: 5, max: 500, step: 5 },
  { key: 'sortBy', label: 'Sort by', type: 'select', def: 'ev', options: [['ev', 'Expected value'], ['edge', 'Edge'], ['prob', 'Hit probability'], ['kelly', 'Kelly stake']] },

  { group: 'Same-game correlation' },
  { key: 'corrMode', label: 'Correlation source', type: 'select', def: 'empirical', options: [['empirical', 'Measure from shared past games, else defaults'], ['manual', 'Defaults below only']] },
  { key: 'corrShrinkK', label: 'Correlation shrink (games)', type: 'number', def: 20, min: 0, max: 200, step: 1, help: 'Measured correlation is pulled toward the default as if this many games at the default were added.' },
  { key: 'corrSamePlayer', label: 'Default: same player', type: 'number', def: 0, min: -0.9, max: 0.9, step: 0.05 },
  { key: 'corrSameTeam', label: 'Default: same team', type: 'number', def: 0, min: -0.9, max: 0.9, step: 0.05 },
  { key: 'corrSameGame', label: 'Default: same game, other', type: 'number', def: 0, min: -0.9, max: 0.9, step: 0.05, help: 'Defaults are 0 (independent) because the right values are unknown until measured. Positive = legs tend to hit together.' },

  { group: 'Parlay finder (🔍 Find tab)' },
  { key: 'finderMinPayout', label: 'Minimum payout (× your bet)', type: 'number', def: 2, min: 1.1, max: 100, step: 0.1, help: '2 = a $10 bet must return at least $20 in total.' },
  { key: 'finderCushion', label: 'Room for bet365\'s cut', type: 'number', def: 1.2, min: 1, max: 3, step: 0.05, help: 'bet365 pays less than the fair price. 1.2 = the fair payout must be 20% above your minimum, so bet365\'s real price can still reach it. bet365\'s exact cut isn\'t published here — adjust after comparing a few real prices.' },
  { key: 'finderLegs', label: 'Legs per parlay', type: 'number', def: 3, min: 2, max: 4, step: 1 },
  { key: 'finderMaxShow', label: 'Parlays to show', type: 'number', def: 10, min: 1, max: 50, step: 1 },
  { key: 'finderMinLegProb', label: 'Lowest leg chance allowed', type: 'number', def: 0.4, min: 0.05, max: 0.95, step: 0.01, help: '0.4 = never use a bet with under a 40% chance.' },
  { key: 'finderMaxLegProb', label: 'Highest leg chance allowed', type: 'number', def: 0.95, min: 0.5, max: 0.999, step: 0.01, help: 'Skips near-certain bets that bet365 may not offer or pays almost nothing for.' },
  { key: 'finderMaxPerGame', label: 'Max legs from one game', type: 'number', def: 2, min: 1, max: 4, step: 1, help: '1 = never same-game.' },
  { key: 'finderLegUse', label: 'Max times one bet can repeat across parlays', type: 'number', def: 2, min: 1, max: 10, step: 1, help: 'Keeps the list from being the same few bets over and over.' },
  { key: 'finderPoolSize', label: 'Best bets to combine', type: 'number', def: 60, min: 10, max: 120, step: 5, help: 'The top bets by chance that get mixed into parlays. Higher = slower.' },
  { key: 'finderTopF', label: 'Forwards per team to scan (most ice time)', type: 'number', def: 9, min: 0, max: 20, step: 1, help: 'Sportsbooks mostly post props for regulars. 9 = each team\'s 9 forwards with the most ice time in their last 5 games. 0 = everyone.' },
  { key: 'finderTopD', label: 'Defencemen per team to scan (most ice time)', type: 'number', def: 4, min: 0, max: 10, step: 1, help: '0 = everyone. Needs "Box scores per team" above 0.' },
  { key: 'fSog', label: 'Use shots on goal', type: 'bool', def: true },
  { key: 'fScoring', label: 'Use goals, points, assists', type: 'bool', def: true },
  { key: 'fLines', label: 'Use game lines (moneyline, puck line, totals)', type: 'bool', def: true },
  { key: 'fBlocks', label: 'Use blocked shots & goalie saves', type: 'bool', def: true },

  { group: 'Bankroll' },
  { key: 'bankroll', label: 'Bankroll ($)', type: 'number', def: 100, min: 0, max: 10000000, step: 1 },
  { key: 'kellyFraction', label: 'Kelly fraction', type: 'number', def: 0.25, min: 0, max: 1, step: 0.05, help: '1 = full Kelly (aggressive). 0.25 = quarter Kelly.' },
  { key: 'maxStakePct', label: 'Max stake (% of bankroll)', type: 'number', def: 2, min: 0, max: 100, step: 0.5 },

  { group: 'Display' },
  { key: 'oddsFormat', label: 'Odds format', type: 'select', def: 'american', options: [['american', 'American (+150)'], ['decimal', 'Decimal (2.50)']] },
];
const DEFAULTS = Object.fromEntries(SCHEMA.filter(s => s.key).map(s => [s.key, s.def]));
let S = Object.assign({}, DEFAULTS, LS.get('pv_settings', {}));
function saveSettings() { LS.set('pv_settings', S); }

/* ---------- markets ---------- */
const PM = {
  sog:     { label: 'Shots on goal', src: 'log', get: e => e.shots, opp: 'shotsAllowed', line: 2.5 },
  goals:   { label: 'Goals', src: 'log', get: e => e.goals, opp: 'goalsAllowed', line: 0.5 },
  first:   { label: 'First goalscorer', src: 'log', get: e => e.goals, opp: 'goalsAllowed', line: 0.5, first: true },
  assists: { label: 'Assists', src: 'log', get: e => e.assists, opp: 'goalsAllowed', line: 0.5 },
  points:  { label: 'Points', src: 'log', get: e => e.points, opp: 'goalsAllowed', line: 0.5 },
  ppp:     { label: 'Power-play points', src: 'log', get: e => e.powerPlayPoints, opp: 'goalsAllowed', line: 0.5 },
  blocks:  { label: 'Blocked shots', src: 'box', get: p => p.b, opp: 'oppShotsFor', line: 1.5 },
  hits:    { label: 'Hits', src: 'box', get: p => p.h, opp: null, line: 1.5 },
  pim:     { label: 'Penalty minutes', src: 'log', get: e => e.pim, opp: null, line: 0.5 },
  saves:   { label: 'Goalie saves', src: 'glog', get: e => (e.shotsAgainst != null && e.goalsAgainst != null) ? e.shotsAgainst - e.goalsAgainst : null, opp: 'oppShotsFor', line: 25.5, goalie: true },
  ga:      { label: 'Goalie goals against', src: 'glog', get: e => e.goalsAgainst, opp: 'oppGoalsFor', line: 2.5, goalie: true },
};
const TM = {
  ml:        { label: 'Moneyline (incl. OT/SO)', team: true, key: 'game' },
  spread:    { label: 'Puck line / spread', team: true, line: -1.5, key: 'team' },
  total:     { label: 'Game total goals', ou: true, line: 5.5, game: true, key: 'game' },
  teamTotal: { label: 'Team total goals', team: true, ou: true, line: 2.5, key: 'team' },
  reg3:      { label: '60-minute result (3-way)', team: true, sides: [['win', 'Team wins in regulation'], ['draw', 'Tied after 60 min']], key: 'game' },
  btts:      { label: 'Both teams to score', game: true, yn: true, key: 'game' },
  teamFirst: { label: 'Team to score first', team: true, key: 'game' },
  teamShots: { label: 'Team shots on goal', team: true, ou: true, line: 29.5, key: 'team' },
  gameShots: { label: 'Game total shots on goal', ou: true, line: 58.5, game: true, key: 'game' },
};
const OPP_LABEL = { shotsAllowed: 'shots allowed per game by', goalsAllowed: 'goals allowed per game by', oppShotsFor: 'shots per game by', oppGoalsFor: 'goals per game by' };

/* ---------- small helpers ---------- */
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : null;
function variance(a) { if (a.length < 2) return null; const m = mean(a); return a.reduce((s, x) => s + (x - m) ** 2, 0) / (a.length - 1); }
const pct = (p, d = 1) => (p == null || !isFinite(p)) ? '–' : (p * 100).toFixed(d) + '%';
const fx = (x, d = 2) => (x == null || !isFinite(x)) ? '–' : (+x).toFixed(d);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
function toiMin(t) { if (!t || typeof t !== 'string') return null; const [m, s] = t.split(':').map(Number); return isFinite(m) ? m + (s || 0) / 60 : null; }
function todayStr() { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function seasonLabel(s) { const y = Math.floor(s / 10000); return y + '-' + String(y + 1).slice(2); }

/* ---------- odds ---------- */
function parseOdds(str) {
  const s = String(str ?? '').trim(); if (!s) return null;
  const n = parseFloat(s); if (!isFinite(n)) return null;
  if (/^[+-]/.test(s) || Math.abs(n) >= 100) {
    if (n >= 100) return 1 + n / 100;
    if (n <= -100) return 1 + 100 / (-n);
    return null;
  }
  return n > 1 ? n : null;
}
function fmtOdds(dec) {
  if (!dec || !isFinite(dec) || dec <= 1) return '–';
  if (S.oddsFormat === 'decimal') return dec.toFixed(2);
  return dec >= 2 ? '+' + Math.round((dec - 1) * 100) : '-' + Math.round(100 / (dec - 1));
}
function oddsInputVal(dec) { if (!dec) return ''; return S.oddsFormat === 'decimal' ? dec.toFixed(2) : fmtOdds(dec); }

/* ---------- distributions ---------- */
function lgamma(x) {
  const c = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
  if (x < 0.5) return Math.log(Math.PI / Math.sin(Math.PI * x)) - lgamma(1 - x);
  x -= 1; let a = c[0]; const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += c[i] / (x + i);
  return 0.5 * Math.log(2 * Math.PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
function poisPmf(k, l) { if (l <= 0) return k === 0 ? 1 : 0; return Math.exp(k * Math.log(l) - l - lgamma(k + 1)); }
function nbPmf(k, m, r) { const p = r / (r + m); return Math.exp(lgamma(k + r) - lgamma(r) - lgamma(k + 1) + r * Math.log(p) + k * Math.log(1 - p)); }
function dist(m, disp) {
  const vr = m * Math.max(1, disp);
  const maxK = Math.ceil(m + 12 * Math.sqrt(vr) + 10);
  const out = new Array(maxK + 1);
  if (disp <= 1.0001) for (let k = 0; k <= maxK; k++) out[k] = poisPmf(k, m);
  else { const r = Math.max(0.5, m / (disp - 1)); for (let k = 0; k <= maxK; k++) out[k] = nbPmf(k, m, r); }
  return out;
}
function tail(pmf, line) {
  let over = 0, under = 0, push = 0;
  pmf.forEach((p, k) => { if (k > line) over += p; else if (k < line) under += p; else push += p; });
  const s = over + under + push || 1;
  return { over: over / s, under: under / s, push: push / s };
}
function trimPmf(pmf, line) {
  const out = []; let c = 0;
  for (let k = 0; k < pmf.length; k++) { out.push(pmf[k]); c += pmf[k]; if (c > 0.9995 && k > line + 2) break; }
  return out;
}
function dispersion(vals) {
  const m = mean(vals), v = variance(vals);
  const raw = (m > 0 && v != null) ? v / m : 1;
  const n = vals.length;
  const disp = S.distModel === 'poisson' ? 1 : Math.max(1, 1 + (n / (n + 10)) * (raw - 1));
  return { raw, disp };
}

/* ---------- seasons ---------- */
let CUR = 20262027;
function seasonFromDate(ds) { const d = new Date(ds + 'T12:00:00'); const y = d.getFullYear(), m = d.getMonth() + 1; const s = m >= 8 ? y : y - 1; return s * 10000 + s + 1; }
function seasonIdx(season) { return Math.floor(CUR / 10000) - Math.floor(season / 10000); }
function seasonList(n) { const sy = Math.floor(CUR / 10000); return Array.from({ length: n }, (_, i) => (sy - i) * 10000 + (sy - i + 1)); }

/* =====================================================================
   DATA LAYER
   ===================================================================== */
const NHL = 'https://api-web.nhle.com/';
const DEFAULT_PROXY = 'https://nhl.justinharrisonreid.workers.dev'; // used when Settings → Proxy URL is blank
const memCache = new Map(), inflight = new Map();
let directWorks = null;
async function rawFetch(url) {
  const r = await fetch(url);
  if (!r.ok) { const e = new Error('HTTP ' + r.status + ' for ' + url); e.status = r.status; throw e; }
  return r.json();
}
function netError() {
  return new Error('Could not reach NHL data. Your browser may be blocking direct calls — set up the free proxy in Settings → Proxy setup, then set Connection mode.');
}
async function api(path, ttl = 600000) {
  const c = memCache.get(path);
  if (c && Date.now() - c.t < ttl) return c.v;
  if (inflight.has(path)) return inflight.get(path);
  const pr = (async () => {
    const mode = S.connMode; let v;
    const proxy = (S.proxyUrl || DEFAULT_PROXY).trim().replace(/\/+$/, '');
    if (mode !== 'proxy' && !(directWorks === false && proxy && mode === 'auto')) {
      try { v = await rawFetch(NHL + path); directWorks = true; }
      catch (e) {
        if (e.status) throw e;
        if (directWorks !== true) directWorks = false;
        if (mode === 'direct' || !proxy) throw netError();
      }
    }
    if (v === undefined) {
      if (!proxy) throw netError();
      try { v = await rawFetch(proxy + '/' + path); }
      catch (e) { if (e.status) throw e; throw new Error('Proxy did not respond. Check the Proxy URL in Settings.'); }
    }
    memCache.set(path, { t: Date.now(), v });
    return v;
  })();
  inflight.set(path, pr);
  try { return await pr; } finally { inflight.delete(path); }
}
function limiter(n) {
  let active = 0; const q = [];
  const next = () => {
    if (active >= n || !q.length) return;
    active++; const { fn, res, rej } = q.shift();
    fn().then(res, rej).finally(() => { active--; next(); });
  };
  return fn => new Promise((res, rej) => { q.push({ fn, res, rej }); next(); });
}
const limit = limiter(6);

/* box score store: trimmed, final games only, persisted */
let BOX = LS.get('pv_box', {});
function saveBox() {
  const ids = Object.keys(BOX);
  if (ids.length > 700) { ids.sort((a, b) => (BOX[a].saved || 0) - (BOX[b].saved || 0)).slice(0, ids.length - 600).forEach(id => delete BOX[id]); }
  if (!LS.set('pv_box', BOX)) { BOX = {}; LS.set('pv_box', BOX); }
}
let boxDirty = false;
function trimBox(b, g) {
  const t = { id: b.id || g.id, date: g.date, season: g.season, final: true, saved: Date.now(),
    home: { a: b.homeTeam?.abbrev, s: b.homeTeam?.score, sog: b.homeTeam?.sog },
    away: { a: b.awayTeam?.abbrev, s: b.awayTeam?.score, sog: b.awayTeam?.sog }, pl: {} };
  const pbg = b.playerByGameStats || {};
  for (const side of ['homeTeam', 'awayTeam']) {
    const abbr = side === 'homeTeam' ? t.home.a : t.away.a; const grp = pbg[side] || {};
    for (const k of ['forwards', 'defense']) for (const p of (grp[k] || [])) {
      t.pl[p.playerId] = { t: abbr, h: p.hits ?? null, b: p.blockedShots ?? null, s: p.sog ?? null, toi: toiMin(p.toi) };
    }
    for (const p of (grp.goalies || [])) t.pl[p.playerId] = { t: abbr, gk: 1, sa: p.shotsAgainst ?? null, ga: p.goalsAgainst ?? null, st: p.starter ?? null, toi: toiMin(p.toi) };
  }
  return t;
}
async function getBox(g) {
  if (BOX[g.id]) return BOX[g.id];
  const b = await limit(() => api(`v1/gamecenter/${g.id}/boxscore`, 864e5));
  const t = trimBox(b, g);
  BOX[g.id] = t; boxDirty = true;
  return t;
}

async function playerLogs(pid, seasons, types) {
  const all = [];
  await Promise.all(seasons.flatMap(s => types.map(gt =>
    limit(() => api(`v1/player/${pid}/game-log/${s}/${gt}`, 600000))
      .then(d => { for (const e of (d.gameLog || [])) all.push(Object.assign({}, e, { season: s, gt })); })
      .catch(() => {}))));
  return all;
}

/* ---------- game context ---------- */
const ctxCache = new Map();
function ctxSig(g) { return [g.id, S.seasonsBack, S.h2hSeasonsBack, S.boxDepth, S.includePlayoffs, S.seasonOverride].join('|'); }
async function loadCtx(g, progress = () => {}) {
  const key = ctxSig(g);
  if (ctxCache.has(key)) { const c = ctxCache.get(key); CUR = c.season; c.tm = teamModel(c); return c; }
  const season = /^\d{8}$/.test(S.seasonOverride) ? +S.seasonOverride : (g.season || seasonFromDate(g.date));
  CUR = season;
  const ctx = { key, game: g, date: g.date, season, home: g.home, away: g.away, standings: {}, players: [], sched: {}, box: {}, boxStats: {} };

  progress('Loading standings and rosters…');
  const stPath = g.date < todayStr() ? `v1/standings/${g.date}` : 'v1/standings/now';
  const [stand, rH, rA] = await Promise.all([
    api(stPath, 300000).catch(() => api('v1/standings/now', 300000)),
    api(`v1/roster/${g.home}/current`, 3600000).catch(() => null),
    api(`v1/roster/${g.away}/current`, 3600000).catch(() => null),
  ]);
  let sgf = 0, sgp = 0;
  for (const r of (stand.standings || [])) {
    const a = r.teamAbbrev?.default; if (!a) continue;
    ctx.standings[a] = r; sgf += r.goalFor || 0; sgp += r.gamesPlayed || 0;
  }
  ctx.league = { gpg: sgp ? sgf / sgp : null, teams: Object.keys(ctx.standings).length };
  for (const [abbr, ro] of [[g.home, rH], [g.away, rA]]) {
    if (!ro) continue;
    for (const grp of ['forwards', 'defensemen', 'goalies']) for (const p of (ro[grp] || [])) {
      ctx.players.push({ id: p.id, name: `${p.firstName?.default || ''} ${p.lastName?.default || ''}`.trim(), pos: p.positionCode, num: p.sweaterNumber, team: abbr });
    }
  }

  progress('Loading schedules and results…');
  const seasons = seasonList(Math.max(S.seasonsBack, S.h2hSeasonsBack));
  const types = S.includePlayoffs ? [2, 3] : [2];
  for (const abbr of [g.home, g.away]) {
    const lists = await Promise.all(seasons.map(s => limit(() => api(`v1/club-schedule-season/${abbr}/${s}`, s === season ? 600000 : 864e5)).then(d => d.games || []).catch(() => [])));
    const seen = new Set(), out = [];
    for (const x of lists.flat()) {
      if (seen.has(x.id)) continue; seen.add(x.id);
      if (!['OFF', 'FINAL'].includes(x.gameState) || !types.includes(x.gameType)) continue;
      if (!(x.gameDate < g.date)) continue;
      if (x.homeTeam?.score == null || x.awayTeam?.score == null) continue;
      out.push({ id: x.id, date: x.gameDate, season: x.season, type: x.gameType, home: x.homeTeam.abbrev, away: x.awayTeam.abbrev, hs: x.homeTeam.score, as: x.awayTeam.score, reg: (x.gameOutcome?.lastPeriodType || 'REG') === 'REG', last: x.gameOutcome?.lastPeriodType || 'REG' });
    }
    out.sort((a, b) => b.date.localeCompare(a.date));
    ctx.sched[abbr] = out;
  }

  if (S.boxDepth > 0) {
    let done = 0; const tot = Math.min(S.boxDepth, ctx.sched[g.home].length) + Math.min(S.boxDepth, ctx.sched[g.away].length);
    for (const abbr of [g.home, g.away]) {
      const hist = ctx.sched[abbr].slice(0, S.boxDepth);
      ctx.box[abbr] = (await Promise.all(hist.map(h => getBox(h).then(b => { done++; progress(`Loading box scores ${done}/${tot}…`); return b; }).catch(() => null)))).filter(Boolean);
    }
    if (boxDirty) { saveBox(); boxDirty = false; }
    const allSog = [], seen = new Set();
    for (const abbr of [g.home, g.away]) {
      const sf = [], sa = [], tot2 = [], games = [];
      for (const b of ctx.box[abbr]) {
        const isH = b.home.a === abbr; const me = isH ? b.home : b.away, op = isH ? b.away : b.home;
        if (me.sog == null || op.sog == null) continue;
        sf.push(me.sog); sa.push(op.sog); tot2.push(me.sog + op.sog);
        games.push({ id: b.id, date: b.date, sf: me.sog, sa: op.sog, opp: op.a, home: isH });
        if (!seen.has(b.id)) { seen.add(b.id); allSog.push(me.sog, op.sog); }
      }
      if (sf.length) ctx.boxStats[abbr] = { n: sf.length, sf: mean(sf), sa: mean(sa), sfArr: sf, saArr: sa, totArr: tot2, games };
    }
    ctx.shotBase = allSog.length >= 6 ? mean(allSog) : null;
  } else { ctx.box[g.home] = []; ctx.box[g.away] = []; ctx.shotBase = null; }

  ctx.tm = teamModel(ctx);
  ctxCache.set(key, ctx);
  if (ctxCache.size > 6) ctxCache.delete(ctxCache.keys().next().value);
  return ctx;
}

function oppRatios(ctx, opp) {
  const st = ctx.standings[opp], lg = ctx.league.gpg, bs = ctx.boxStats[opp];
  const gp = st?.gamesPlayed;
  return {
    goalsAllowed: (gp && lg) ? (st.goalAgainst / gp) / lg : null,
    oppGoalsFor: (gp && lg) ? (st.goalFor / gp) / lg : null,
    shotsAllowed: (bs && ctx.shotBase) ? bs.sa / ctx.shotBase : null,
    oppShotsFor: (bs && ctx.shotBase) ? bs.sf / ctx.shotBase : null,
  };
}

/* =====================================================================
   PLAYER MODEL
   ===================================================================== */
const peCache = new Map();
async function playerEntries(ctx, pid, team, mk) {
  const M = PM[mk];
  const key = ctx.key + '|' + pid + '|' + team + '|' + M.src + '|' + mk + '|' + S.goalieStartsOnly;
  if (peCache.has(key)) return peCache.get(key);
  let entries = [];
  if (M.src === 'box') {
    for (const b of (ctx.box[team] || [])) {
      const p = b.pl[pid]; if (!p || p.t !== team) continue;
      const v = M.get(p); if (v == null || !isFinite(v)) continue;
      const home = b.home.a === team;
      entries.push({ gid: b.id, date: b.date, season: b.season, val: v, opp: home ? b.away.a : b.home.a, home, toi: p.toi });
    }
  } else {
    const seasons = seasonList(Math.max(S.seasonsBack, S.h2hSeasonsBack));
    const logs = await playerLogs(pid, seasons, S.includePlayoffs ? [2, 3] : [2]);
    for (const e of logs) {
      if (!(e.gameDate < ctx.date)) continue;
      if (M.src === 'glog' && S.goalieStartsOnly && e.gamesStarted !== 1) continue;
      const v = M.get(e); if (v == null || !isFinite(v)) continue;
      entries.push({ gid: e.gameId, date: e.gameDate, season: e.season, val: v, opp: e.opponentAbbrev, home: e.homeRoadFlag === 'H', toi: toiMin(e.toi) });
    }
  }
  const seen = new Set();
  entries = entries.filter(e => !seen.has(e.gid) && seen.add(e.gid)).sort((a, b) => b.date.localeCompare(a.date));
  peCache.set(key, entries);
  if (peCache.size > 400) peCache.delete(peCache.keys().next().value);
  return entries;
}
function legResult(v, line, side) { if (v > line) return side === 'over'; if (v < line) return side === 'under'; return null; }

function analyzeEntries(entries, o) {
  const K = S.shrinkK;
  const hist = entries.filter(e => seasonIdx(e.season) < S.seasonsBack);
  if (!hist.length) return { error: 'No games found in the chosen history window.' };
  let ws = 0, wv = 0;
  for (const e of hist) { const w = Math.pow(S.seasonDecay, seasonIdx(e.season)); ws += w; wv += w * e.val; }
  const base = ws > 0 ? wv / ws : mean(hist.map(e => e.val));
  const comps = [{ key: 'base', label: `Season-weighted average (${hist.length} games, older seasons ×${S.seasonDecay} each)`, n: hist.length, rate: base, w: S.wSeason }];
  for (const [k, N] of [['short', S.winShort], ['mid', S.winMid], ['long', S.winLong]]) {
    const sl = hist.slice(0, N);
    if (sl.length) comps.push({ key: k, label: `Last ${sl.length} games`, n: sl.length, rate: mean(sl.map(e => e.val)), w: S['w' + cap(k)] });
  }
  const h2h = entries.filter(e => e.opp === o.opp && seasonIdx(e.season) < S.h2hSeasonsBack);
  if (h2h.length) { const raw = mean(h2h.map(e => e.val)); comps.push({ key: 'h2h', label: `vs ${o.opp} (${h2h.length} games, shrunk)`, n: h2h.length, raw, rate: (h2h.length * raw + K * base) / (h2h.length + K), w: S.wH2H }); }
  const ven = hist.filter(e => e.home === o.isHome);
  if (ven.length) { const raw = mean(ven.map(e => e.val)); comps.push({ key: 'venue', label: `${o.isHome ? 'Home' : 'Road'} games (${ven.length}, shrunk)`, n: ven.length, raw, rate: (ven.length * raw + K * base) / (ven.length + K), w: S.wVenue }); }
  let sw = 0, sr = 0;
  for (const c of comps) if (c.w > 0) { sw += c.w; sr += c.w * c.rate; }
  const blended = sw > 0 ? sr / sw : base;

  let toiF = 1, toiInfo = null;
  if (!o.goalie) {
    const tAll = hist.map(e => e.toi).filter(x => x > 0), tRec = hist.slice(0, S.winShort).map(e => e.toi).filter(x => x > 0);
    if (tAll.length >= 3 && tRec.length) { const ra = mean(tRec) / mean(tAll); toiF = clamp(1 + S.toiStrength * (ra - 1), 0.7, 1.3); toiInfo = { recent: mean(tRec), all: mean(tAll), ratio: ra }; }
  }
  let oppF = 1;
  if (o.oppRatio != null && isFinite(o.oppRatio)) oppF = clamp(1 + S.oppStrength * (o.oppRatio - 1), 0.7, 1.3);
  const lambda = Math.max(0.01, blended * toiF * oppF);

  const vs = hist.slice(0, 82).map(e => e.val);
  const d = dispersion(vs);
  const pmf = dist(lambda, d.disp);
  const t = tail(pmf, o.line);
  const pModel = o.side === 'over' ? t.over : t.under;

  const win = hist.slice(0, S.winLong);
  let hits = 0, decided = 0;
  for (const e of win) { const r = legResult(e.val, o.line, o.side); if (r !== null) { decided++; if (r) hits++; } }
  const pEmpRaw = decided ? hits / decided : null;
  const pEmp = (decided + K) > 0 ? (hits + K * pModel) / (decided + K) : pModel;
  const p = clamp((1 - S.empWeight) * pModel + S.empWeight * pEmp, 0.001, 0.999);

  const rows = [];
  const addRow = (label, arr) => {
    if (!arr.length) return; let h = 0, dd = 0;
    for (const e of arr) { const r = legResult(e.val, o.line, o.side); if (r !== null) { dd++; if (r) h++; } }
    rows.push({ label, n: arr.length, avg: mean(arr.map(e => e.val)), hits: h, dec: dd, rate: dd ? h / dd : null });
  };
  addRow(`Last ${S.winShort}`, hist.slice(0, S.winShort));
  addRow(`Last ${S.winMid}`, hist.slice(0, S.winMid));
  addRow(`Last ${S.winLong}`, hist.slice(0, S.winLong));
  for (let i = 0; i < S.seasonsBack; i++) addRow(seasonLabel(CUR - i * 10001), hist.filter(e => seasonIdx(e.season) === i));
  addRow(`vs ${o.opp} (last ${S.h2hSeasonsBack} seasons)`, h2h);
  addRow('Home', hist.filter(e => e.home)); addRow('Road', hist.filter(e => !e.home));

  const outcomes = {};
  for (const e of entries) { const r = legResult(e.val, o.line, o.side); if (r !== null) outcomes[e.gid] = r ? 1 : 0; }
  return {
    lambda, blended, base, comps, toiF, toiInfo, oppF, oppRatio: o.oppRatio, disp: d.disp, rawDisp: d.raw,
    pmf: trimPmf(pmf, o.line), over: t.over, under: t.under, push: t.push, pModel, pEmp, pEmpRaw, hits, decided, p, rows,
    recent: hist.slice(0, Math.max(S.winLong, 10)).map(e => ({ d: e.date, v: e.val, o: e.opp, h: e.home, t: e.toi })),
    h2hGames: h2h.map(e => ({ d: e.date, v: e.val, h: e.home, t: e.toi, s: e.season })),
    outcomes, n: hist.length, lowSample: hist.length < S.minGames,
  };
}

async function analyzePlayer(ctx, pl, mk, line, side) {
  CUR = ctx.season;
  const M = PM[mk]; const team = pl.team;
  const opp = team === ctx.home ? ctx.away : ctx.home, isHome = team === ctx.home;
  const entries = await playerEntries(ctx, pl.id, team, mk);
  const ratios = oppRatios(ctx, opp);
  const oppRatio = M.opp ? ratios[M.opp] : null;
  let res;
  if (M.first) {
    res = analyzeEntries(entries, { line: 0.5, side: 'over', opp, isHome, oppRatio, goalie: false });
    if (!res.error) res = firstScorer(ctx, res, team);
  } else {
    res = analyzeEntries(entries, { line, side, opp, isHome, oppRatio, goalie: !!M.goalie });
  }
  Object.assign(res, { oppKey: M.opp, market: mk, line: M.first ? null : line, side: M.first ? 'yes' : side, team, opp, isHome, name: pl.name, pid: pl.id, pos: pl.pos, src: M.src });
  return res;
}

/* First goalscorer: goals in a game ≈ Poisson process. P(player scores the first goal)
   = (player expected goals / game expected goals) × P(at least one goal). */
function firstScorer(ctx, gr, team) {
  const tm = ctx.tm;
  if (tm.error) return { error: 'First goalscorer needs the team model: ' + tm.error };
  const lt = tm.lH + tm.lA;
  const share = clamp(gr.lambda / lt, 0, 1);
  const pAny = 1 - Math.exp(-lt);
  const p = clamp(share * pAny, 0.0005, 0.999);
  return Object.assign(gr, {
    first: { lt, share, pAny, lTeam: team === ctx.home ? tm.lH : tm.lA, anytime: gr.p },
    pModel: p, p, pEmp: null, pEmpRaw: null, outcomes: null, push: 0,
  });
}

/* =====================================================================
   TEAM / GAME MODEL
   ===================================================================== */
function teamRate(st, venue, kind) {
  const gp = st.gamesPlayed; if (!gp) return null;
  const K = S.shrinkK;
  const overall = (kind === 'For' ? st.goalFor : st.goalAgainst) / gp;
  const vgp = st[venue + 'GamesPlayed'] || 0;
  const vraw = vgp ? st[venue + 'Goals' + kind] / vgp : overall;
  const vr = (vgp * vraw + K * overall) / (vgp + K || 1);
  const split = (1 - S.teamSplitWeight) * overall + S.teamSplitWeight * vr;
  const lgp = st.l10GamesPlayed || 0;
  const l10 = lgp ? st['l10Goals' + kind] / lgp : split;
  return { overall, vraw, vgp, vr, l10, lgp, blended: (1 - S.teamL10Weight) * split + S.teamL10Weight * l10 };
}

/* team market calc */
function tmCalc() {
  const ctx = state.ctx; if (!ctx) return;
  const mk = $('#tmMarket').value, M = TM[mk];
  const spec = { market: mk, team: M.game ? ctx.home : $('#tmTeam').value, side: $('#tmSide').value || 'win', line: (M.ou || mk === 'spread') ? +$('#tmLine').value : null };
  if (mk === 'reg3' && spec.side === 'draw') spec.team = ctx.home;
  const res = analyzeTeam(ctx, spec);
  state.tmLast = { spec, res };
  const out = $('#tmOut');
  if (res.error) { out.innerHTML = `<p class="bad">${esc(res.error)}</p>`; return; }
  const tmp = { kind: 'team', market: mk, team: spec.team, side: res.side, line: spec.line, game: gameMini(ctx.game) };
  out.innerHTML = `<div class="leg" style="margin-top:10px"><div class="t">${esc(legLabel(tmp))}</div>
    <div class="big"><div><span>Probability</span><b>${pct(res.p)}</b></div><div><span>Fair odds</span><b>${fmtOdds(1 / res.p)}</b></div><div><span>Model</span><b>${pct(res.pModel)}</b></div>${res.pEmpRaw != null ? `<div><span>History hit rate</span><b>${res.hits}/${res.decided}</b></div>` : ''}${res.push > 0.0005 ? `<div><span>Push</span><b>${pct(res.push)}</b></div>` : ''}</div>

/* player prop board */
async function pbScan() {
  const ctx = state.ctx; if (!ctx) return;
  const mk = $('#pbMarket').value, M = PM[mk];
  const line = M.first ? null : +$('#pbLine').value, side = M.first ? 'yes' : $('#pbSide').value;
  const tf = $('#pbTeam').value, pf = $('#pbPos').value;
  let players = ctx.players.filter(p => M.goalie ? p.pos === 'G' : p.pos !== 'G');
  if (tf !== 'both') players = players.filter(p => p.team === tf);
  if (!M.goalie && pf !== 'all') players = players.filter(p => pf === 'D' ? p.pos === 'D' : p.pos !== 'D');
  if (!players.length) { $('#pbOut').innerHTML = '<p class="muted">No players found on the current rosters.</p>'; return; }
  const seq = ++state.scanSeq; let done = 0; const rows = [];
  $('#pbOut').innerHTML = `<p class="progress">Scanning 0/${players.length}…</p>`;
  await Promise.all(players.map(async pl => {
    let res; try { res = await analyzePlayer(ctx, pl, mk, line, side); } catch (e) { res = { error: e.message }; }
    rows.push({ pl, res, odds: null }); done++;
    if (seq === state.scanSeq) { const pr = $('#pbOut .progress'); if (pr) pr.textContent = `Scanning ${done}/${players.length}…`; }
  }));
  if (seq !== state.scanSeq) return;
  rows.sort((a, b) => (b.res.p || -1) - (a.res.p || -1));
  state.scan = { gameId: ctx.game.id, mk, line, side, rows };
  renderScan();
}
function renderScan() {
  const sc = state.scan; const M = PM[sc.mk]; const el = $('#pbOut'); if (!el) return;
  const title = M.first ? 'First goalscorer' : `${cap(sc.side)} ${sc.line} ${M.label.toLowerCase()}`;
  let h = `<p class="small"><b>${esc(title)}</b> · ${sc.rows.length} players · sorted by probability</p><div class="tw"><table><tr>
    <th>Player</th><th>Tm</th><th class="n">GP</th><th class="n">Avg L${S.winMid}</th><th class="n">Hit L${S.winLong}</th><th class="n">vs opp</th><th class="n">Model</th><th class="n">Final</th><th class="n">Fair</th><th>bet365</th><th class="n">Edge</th><th class="n">EV</th><th></th></tr>`;
  sc.rows.forEach((r, i) => {

    const mid = s.rows.find(x => x.label === `Last ${S.winMid}`), lng = s.rows.find(x => x.label === `Last ${S.winLong}`);
    const h2 = s.comps.find(c => c.key === 'h2h');
    h += `<tr><td>${esc(r.pl.name)} <span class="muted small">${esc(r.pl.pos)}</span>${s.lowSample ? ' <span class="warn small">small sample</span>' : ''}</td><td>${r.pl.team}</td>
      <td class="n">${s.n}</td><td class="n">${fx(mid?.avg)}</td><td class="n">${M.first ? '–' : (lng ? `${lng.hits}/${lng.dec}` : '–')}</td>
      <td class="n">${h2 ? `${fx(h2.raw)} (${h2.n})` : '–'}</td><td class="n">${pct(s.pModel)}</td><td class="n"><b>${pct(s.p)}</b></td><td class="n">${fmtOdds(1 / s.p)}</td>
      <td><input class="odds sm" data-scanodds="${i}" value="${r.odds ? oddsInputVal(r.odds) : ''}"></td>

  });
  el.innerHTML = h + '</table></div>';
  sc.rows.forEach((r, i) => { if (r.odds) scanEdge(i); });

function scanEdge(i) {
  const r = state.scan.rows[i]; if (!r || r.res.error) return;
  const e = legEV({ p: r.res.p, push: r.res.push, odds: r.odds, adj: 0 });
  const a = $('#se' + i), b = $('#sv' + i);

function scanAdd(i) {

  if (!r.odds) { toast('Type the bet365 odds in that row first'); return; }
  const s = r.res;
  const leg = makeLeg(state.ctx, s, { kind: 'player', market: state.scan.mk, subjectId: r.pl.id, subjectName: r.pl.name, pos: r.pl.pos, team: s.team, opp: s.opp, isHome: s.isHome, line: s.line, side: s.side, odds: r.odds, oddsOther: null });

/* ---------- detail views ---------- */
function barChart(vals, line) {
  if (!vals.length) return '';
  const n = vals.length, W = Math.max(320, n * 20), H = 110;
  const max = Math.max(line == null ? 1 : line + 1, ...vals.map(v => v.v), 1); const bw = W / n;
  let s = `<svg viewBox="0 0 ${W} ${H + 16}" width="100%" style="max-width:${W}px" role="img" aria-label="Recent games">`;
  vals.forEach((v, i) => {
    const h = (v.v / max) * H;
    s += `<rect class="bar ${v.hit ? 'hit' : ''}" x="${i * bw + 2}" y="${H - h}" width="${Math.max(2, bw - 4)}" height="${Math.max(h, 1)}"><title>${esc(v.d)} ${esc(v.o || '')}: ${v.v}</title></rect><text x="${i * bw + bw / 2}" y="${H + 12}" font-size="9" fill="#8b949e" text-anchor="middle">${v.v}</text>`;
  });
  if (line != null) { const ly = H - (line / max) * H; s += `<line x1="0" x2="${W}" y1="${ly}" y2="${ly}" stroke="#f2c94c" stroke-dasharray="4 3"/>`; }
  return s + '</svg>';
}

  h += `<h3>Every game vs ${r.opp} (last ${S.h2hSeasonsBack} seasons)</h3>` + (r.h2hGames.length ? `<div class="tw"><table><tr><th>Date</th><th>Venue</th><th class="n">Value</th><th class="n">TOI</th></tr>${r.h2hGames.map(x => `<tr><td>${x.d}</td><td>${x.h ? 'Home' : 'Road'}</td><td class="n">${x.v}</td><td class="n">${fx(x.t, 1)}</td></tr>`).join('')}</table></div>` : '<p class="muted small">None found.</p>');
  if (!M.first) h += `<h3>Model distribution</h3><div class="tw"><table><tr><th>Value</th>${r.pmf.map((_, k) => `<th class="n">${k}</th>`).join('')}</tr><tr><td>P</td>${r.pmf.map(p => `<td class="n">${pct(p)}</td>`).join('')}</tr></table></div>`;
  return h;
}

function plainLabel(c) {

  if (c.kind === 'player') {

      case 'goals': return k <= 1 ? `${n}: scores a goal` : `${n}: ${k}+ goals`;
      case 'points': return `${n}: ${k}+ point${k > 1 ? 's' : ''}`;
      case 'assists': return `${n}: ${k}+ assist${k > 1 ? 's' : ''}`;
      case 'blocks': return `${n}: ${k}+ blocked shot${k > 1 ? 's' : ''}`;
      case 'saves': return `${n}: ${k}+ saves`;

  }

  switch (c.market) {

    case 'total': return c.side === 'over' ? `${Math.ceil(c.line)}+ total goals (${gl})` : `${Math.floor(c.line)} or fewer total goals (${gl})`;

async function finderGameLegs(ctx, onProg = () => {}) {
  CUR = ctx.season;

  const lastIds = {};
  for (const T of [ctx.home, ctx.away]) lastIds[T] = (ctx.sched[T] || []).slice(0, 2).map(x => x.id);
  const playedRecently = (r, T) => !lastIds[T].length || (r.outcomes && lastIds[T].some(id => id in r.outcomes));
  const mk = (res, extra) => Object.assign({ id: uid(), gameId: g.id, game: g, p: res.p, outcomes: res.outcomes || null, res }, extra);
  if (S.fLines && !ctx.tm.error) {
    const H = ctx.home, A = ctx.away;
    const specs = [['ml', { team: H }], ['ml', { team: A }], ['spread', { team: H, line: -1.5 }], ['spread', { team: A, line: -1.5 }], ['spread', { team: H, line: 1.5 }], ['spread', { team: A, line: 1.5 }],
      ['total', { side: 'over', line: 5.5 }], ['total', { side: 'under', line: 5.5 }], ['total', { side: 'over', line: 6.5 }], ['total', { side: 'under', line: 6.5 }]];
    for (const [m, o] of specs) {
      const r = analyzeTeam(ctx, Object.assign({ market: m, side: 'win', line: null }, o));
      if (!r.error) legs.push(mk(r, { kind: 'team', market: m, team: r.team, side: r.side, line: r.line }));
    }
  }
  const markets = [];
  if (S.fSog) markets.push(['sog', [1.5, 2.5, 3.5]]);
  if (S.fScoring) markets.push(['goals', [0.5]], ['points', [0.5, 1.5]], ['assists', [0.5]]);
  if (S.fBlocks) markets.push(['blocks', [0.5, 1.5, 2.5]]);
  let skaters = markets.length ? ctx.players.filter(p => p.pos !== 'G') : [];
  if (S.finderTopF > 0 || S.finderTopD > 0) {
    const keep = new Set();
    for (const T of [ctx.home, ctx.away]) {
      const boxes = (ctx.box[T] || []).slice(0, 5); if (!boxes.length) { skaters.filter(p => p.team === T).forEach(p => keep.add(p.id)); continue; }
      const toi = {};
      for (const b of boxes) for (const [pid, p] of Object.entries(b.pl)) if (p.t === T && !p.gk && p.toi) (toi[pid] = toi[pid] || []).push(p.toi);
      const avg = id => toi[id] ? toi[id].reduce((s, x) => s + x, 0) / boxes.length : 0;
      const team = skaters.filter(p => p.team === T);
      const pick = (list, n) => (n > 0 ? list.slice().sort((a, b) => avg(b.id) - avg(a.id)).slice(0, n) : list).forEach(p => keep.add(p.id));
      pick(team.filter(p => p.pos !== 'D'), S.finderTopF);
      pick(team.filter(p => p.pos === 'D'), S.finderTopD);

      for (const [m, lines] of markets) for (const line of lines) {
        const r = await analyzePlayer(ctx, pl, m, line, 'over');
        if (r.error || r.lowSample || !playedRecently(r, pl.team)) break;
        legs.push(mk(r, { kind: 'player', market: m, subjectId: pl.id, subjectName: pl.name, pos: pl.pos, team: pl.team, line, side: 'over' }));
      }
    } catch (e) {}

    const starts = {};
    for (const b of (ctx.box[T] || []).slice(0, 10)) for (const [pid, p] of Object.entries(b.pl)) if (p.gk && p.st && p.t === T) starts[pid] = (starts[pid] || 0) + 1;
    const best = Object.entries(starts).sort((a, b) => b[1] - a[1])[0];
    const pl = best && ctx.players.find(p => p.id === +best[0]);
    if (!pl) continue;
    for (const line of [19.5, 22.5, 24.5, 27.5]) {
      try {
        const r = await analyzePlayer(ctx, pl, 'saves', line, 'over');
        if (r.error || r.lowSample) break;
        legs.push(mk(r, { kind: 'player', market: 'saves', subjectId: pl.id, subjectName: pl.name, pos: 'G', team: T, line, side: 'over', goalie: true }));
      } catch (e) { break; }
    }

}
function finderBuild(cands) {

      if (!label || !(p > 0 && p < 1) || !odds) { toast('Fill in description, probability and odds'); break; }
      const gid = +$('#cuGame').value || null;
      const g = gid ? (LEGS.find(l => l.gameId === gid)?.game || (state.gameSel?.id === gid ? state.gameSel : null)) : null;
      LEGS.push({ id: uid(), kind: 'custom', label, p, pModel: p, pEmp: null, push: 0, odds, oddsOther: null, adj: 0, include: true, lock: false, gameId: gid, game: g, team: null, outcomes: null, details: null, created: Date.now(), calcAt: Date.now() });
      saveLegs(); viewLegs(); break;
    }
    case 'genParlays': state.results = generateParlays(); renderResults(); break;
    case 'evalLocked': {
      const locked = LEGS.filter(l => l.lock && l.odds > 1);
      if (locked.length < 2) { toast('Lock at least 2 legs in the pool first'); break; }
      state.results = { results: [evalParlay(locked)], checked: 1, free: 0, locked: locked.length };
      renderResults(); break;
    }
    case 'parDetail': openModal(parlayDetailHTML(state.results.results[i], i)); break;
    case 'pdReprice': { const x = state.results.results[i]; const o = parseOdds($('#pdOdds').value); const nx = evalParlay(x.legs, o || undefined); state.results.results[i] = nx; openModal(parlayDetailHTML(nx, i)); renderResults(); break; }
    case 'pdSave': {
      const x = state.results.results[i]; const stake = parseFloat($('#pdStake').value) || 0;
      TRACK.push({ id: uid(), created: Date.now(), legs: x.legs.map(l => ({ label: legLabel(l), odds: l.odds, p: effP(l), game: l.game || null })), dec: x.dec, p: x.p, stake, status: 'open', closing: null });
      saveTrack(); closeModal(); toast('Saved to tracker'); break;
    }
    case 'trDel': TRACK = TRACK.filter(t => t.id !== id); saveTrack(); viewTracker(); break;
    case 'exportAll': {
      const blob = new Blob([JSON.stringify({ app: 'parlay-value', exported: new Date().toISOString(), settings: S, legs: LEGS, tracker: TRACK }, null, 1)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'parlay-value-backup.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); break;
    }
    case 'testConn': testConn(); break;
    case 'copyWorker': navigator.clipboard?.writeText(WORKER_CODE).then(() => toast('Copied'), () => toast('Copy failed — select the text instead')); break;
    case 'resetSettings': if (confirm('Reset all settings to defaults?')) { const keep = { proxyUrl: S.proxyUrl, connMode: S.connMode }; S = Object.assign({}, DEFAULTS, keep); saveSettings(); viewSettings(); } break;
    case 'clearCache': BOX = {}; LS.set('pv_box', BOX); memCache.clear(); ctxCache.clear(); peCache.clear(); toast('Cache cleared'); break;
  }
}
function onInput(ev) {
  const t = ev.target;
  if (t.dataset.fprice != null) { const i = +t.dataset.fprice; const c = state.found?.cards[i]; if (c) { c.price = parseOdds(t.value); fVerdict(i); saveFound(); } return; }
  if (t.dataset.scanodds != null) { const i = +t.dataset.scanodds; if (state.scan?.rows[i]) { state.scan.rows[i].odds = parseOdds(t.value); scanEdge(i); } return; }
  if (t.id === 'tmOdds' || t.id === 'tmOther') { tmEdgeUpdate(); return; }
}
function onChange(ev) {
  const t = ev.target;
  if (t.id === 'tmMarket') { syncTmForm(); $('#tmOut').innerHTML = ''; return; }
  if (t.id === 'pbMarket') { syncPbForm(); return; }
  if (t.id === 'importFile') { importData(t.files[0]); return; }
  if (t.dataset.set) {
    const s = SCHEMA.find(x => x.key === t.dataset.set); let v;
    if (s.type === 'bool') v = t.checked;
    else if (s.type === 'number') { v = parseFloat(t.value); if (!isFinite(v)) { t.value = S[s.key]; return; } v = clamp(v, s.min, s.max); if (s.step === 1) v = Math.round(v); t.value = v; }
    else v = t.value.trim();
    S[s.key] = v; saveSettings();
    if (s.key === 'connMode' || s.key === 'proxyUrl') directWorks = null;
    if (s.key === 'oddsFormat' && state.tab !== 'settings') setTab(state.tab);
    toast('Saved');
    return;
  }
  if (t.dataset.leg) {
    const l = legById(t.dataset.leg); if (!l) return; const f = t.dataset.f;
    if (f === 'include' || f === 'lock') l[f] = t.checked;
    else if (f === 'odds' || f === 'oddsOther') { const o = parseOdds(t.value); if (f === 'odds' && !o) { toast('Invalid odds'); t.value = oddsInputVal(l.odds); return; } l[f] = o; }
    else if (f === 'adj') l.adj = clamp(parseFloat(t.value) || 0, -50, 50);
    else if (f === 'pcustom') { const p = parseFloat(t.value) / 100; if (p > 0 && p < 1) { l.p = p; l.pModel = p; } }
    saveLegs(); viewLegs(); return;
  }
  if (t.dataset.tr) {
    const tr = TRACK.find(x => x.id === t.dataset.tr); if (!tr) return;
    if (t.dataset.f === 'status') tr.status = t.value; else tr.closing = parseOdds(t.value);
    saveTrack(); viewTracker();
  }
}
function importData(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (d.app !== 'parlay-value') throw new Error('Not a Parlay Value backup');
      if (!confirm('Replace current settings, legs and tracker with this backup?')) return;
      S = Object.assign({}, DEFAULTS, d.settings || {}); LEGS = d.legs || []; TRACK = d.tracker || [];
      saveSettings(); saveLegs(); saveTrack(); toast('Imported'); setTab(state.tab);
    } catch (e) { toast('Import failed: ' + e.message); }
  };
  r.readAsText(file);
}
function boot() {
  V = $('#view');
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
  if (LS.get('pv_adv', false)) { document.body.classList.add('adv'); $('#advToggle').textContent = 'Simple ◂'; }
  setTab('find');
}
